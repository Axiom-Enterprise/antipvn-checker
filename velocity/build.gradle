plugins {
    id 'java'
    id 'com.gradleup.shadow'
}

dependencies {
    implementation project(':common')
    compileOnly 'com.velocitypowered:velocity-api:3.5.1'
    annotationProcessor 'com.velocitypowered:velocity-api:3.5.1'
    implementation 'io.github.revxrsal:lamp.common:4.0.0-rc.18'
    implementation 'io.github.revxrsal:lamp.velocity:4.0.0-rc.18'
    implementation 'io.github.revxrsal:lamp.brigadier:4.0.0-rc.18'
}

def generatedVersionDir = layout.buildDirectory.dir('generated/sources/version')
def generateVersionSource = tasks.register('generateVersionSource') {
    outputs.dir(generatedVersionDir)
    doLast {
        def output = generatedVersionDir.get().asFile.toPath().resolve('com/axiom/antivpn/velocity/BuildVersion.java')
        output.toFile().parentFile.mkdirs()
        output.toFile().text = "package com.axiom.antivpn.velocity;\n\npublic final class BuildVersion {\n    public static final String VALUE = \"${project.version}\";\n\n    private BuildVersion() { }\n}\n"
    }
}

sourceSets.main.java.srcDir(generatedVersionDir)
tasks.named('compileJava') { dependsOn(generateVersionSource) }

shadowJar {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    archiveClassifier.set('')
    archiveBaseName.set('AxiomAntiVPN-Velocity')

    relocate 'com.github.benmanes.caffeine', 'com.axiom.antivpn.libs.caffeine'
    relocate 'com.google.gson', 'com.axiom.antivpn.libs.gson'
    relocate 'org.yaml.snakeyaml', 'com.axiom.antivpn.libs.snakeyaml'
    relocate 'revxrsal.commands', 'com.axiom.antivpn.libs.lamp'
    relocate 'net.kyori.adventure.text.minimessage', 'com.axiom.antivpn.libs.minimessage'

    minimize {
        exclude dependency('com.github.ben-manes.caffeine:.*')
        exclude dependency('io.github.revxrsal:.*')
        exclude dependency('org.xerial:sqlite-jdbc:.*')
    }
}

build.dependsOn shadowJar
