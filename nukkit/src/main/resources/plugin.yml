name: AxiomAntiVPN
version: '${version}'
main: com.axiom.antivpn.nukkit.NukkitAntiVpnPlugin
api: ["1.0.0"]
author: Axiom
description: Advanced VPN & Proxy Detection powered by Axiom AntiVPN API
website: https://antivpn.mathsanalysis.com

commands:
  vpn:
    aliases: [antivpn]
    description: Axiom AntiVPN commands
    usage: "/vpn <check|stats|history|whitelist|status|cache|reload>"
    permission: antivpn.admin

permissions:
  antivpn.admin:
    description: Access to all AntiVPN commands
    default: op
  antivpn.bypass:
    description: Bypass VPN detection checks
    default: false
  antivpn.alerts:
    description: Receive staff alerts when a player is blocked
    default: op
