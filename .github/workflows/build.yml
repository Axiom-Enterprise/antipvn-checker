name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build all platforms
        run: ./gradlew clean build --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp bukkit/build/libs/AxiomAntiVPN-Bukkit-*.jar dist/ || true
          cp bungeecord/build/libs/AxiomAntiVPN-BungeeCord*.jar dist/ || true
          cp velocity/build/libs/AxiomAntiVPN-Velocity*.jar dist/ || true
          cp api/build/libs/*.jar dist/ || true
          ls -la dist/

      - name: Upload Bukkit artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxiomAntiVPN-Bukkit
          path: bukkit/build/libs/AxiomAntiVPN-Bukkit-*.jar
          if-no-files-found: error

      - name: Upload Bungee artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxiomAntiVPN-Bungee
          path: bungeecord/build/libs/AxiomAntiVPN-BungeeCord*.jar
          if-no-files-found: error

      - name: Upload Velocity artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxiomAntiVPN-Velocity
          path: velocity/build/libs/AxiomAntiVPN-Velocity*.jar
          if-no-files-found: error

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxiomAntiVPN-API
          path: api/build/libs/*.jar
          if-no-files-found: warn

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
