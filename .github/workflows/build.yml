name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione JAR (es. 1.2.3); vuoto per versione automatica'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve build version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "${MANUAL_VERSION}" ]]; then
            VERSION="${MANUAL_VERSION}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            VERSION="1.0.2-pr.${{ github.event.pull_request.number }}.${GITHUB_RUN_NUMBER}"
          else
            VERSION="1.0.2-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Building AxiomAntiVPN ${VERSION}"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build all platforms
        run: ./gradlew clean build --no-daemon -PbuildVersion="${{ steps.version.outputs.version }}"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp bukkit/build/libs/AxiomAntiVPN-Bukkit-*.jar dist/ || true
          cp bungeecord/build/libs/AxiomAntiVPN-BungeeCord*.jar dist/ || true
          cp velocity/build/libs/AxiomAntiVPN-Velocity*.jar dist/ || true
          cp api/build/libs/*.jar dist/ || true
          ls -la dist/

      - name: Upload Bukkit artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxiomAntiVPN-Bukkit-${{ steps.version.outputs.version }}
          path: bukkit/build/libs/AxiomAntiVPN-Bukkit-*.jar
          if-no-files-found: error

      - name: Upload Bungee artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxiomAntiVPN-BungeeCord-${{ steps.version.outputs.version }}
          path: bungeecord/build/libs/AxiomAntiVPN-BungeeCord*.jar
          if-no-files-found: error

      - name: Upload Velocity artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxiomAntiVPN-Velocity-${{ steps.version.outputs.version }}
          path: velocity/build/libs/AxiomAntiVPN-Velocity*.jar
          if-no-files-found: error

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxiomAntiVPN-API-${{ steps.version.outputs.version }}
          path: api/build/libs/*.jar
          if-no-files-found: warn

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: AxiomAntiVPN ${{ steps.version.outputs.version }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: dist/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
