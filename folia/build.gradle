plugins {
    id 'java'
    id 'com.gradleup.shadow'
}

dependencies {
    implementation project(':common')
    implementation project(':bukkit')
    compileOnly 'dev.folia:folia-api:1.21.11-R0.1-SNAPSHOT'
    implementation 'io.github.revxrsal:lamp.common:4.0.0-rc.18'
    implementation 'io.github.revxrsal:lamp.bukkit:4.0.0-rc.18'
}

shadowJar {
    archiveClassifier.set('')
    archiveBaseName.set('AxiomAntiVPN-Folia')
}

build.dependsOn shadowJar

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':bukkit').sourceSets.main.resources
    filesMatching('plugin.yml') { expand(version: project.version) }
}
