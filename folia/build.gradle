plugins {
    id 'java'
    id 'com.gradleup.shadow'
}

dependencies {
    implementation project(':common')
    compileOnly 'dev.folia:folia-api:1.21.11-R0.1-SNAPSHOT'
    implementation 'io.github.revxrsal:lamp.common:4.0.0-rc.18'
    implementation 'io.github.revxrsal:lamp.bukkit:4.0.0-rc.18'
    compileOnly 'me.clip:placeholderapi:2.12.3'
}

shadowJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveClassifier.set('')
    archiveBaseName.set('AxiomAntiVPN-Folia')

    relocate 'com.github.benmanes.caffeine', 'com.axiom.antivpn.libs.caffeine'
    relocate 'com.google.gson', 'com.axiom.antivpn.libs.gson'
    relocate 'org.yaml.snakeyaml', 'com.axiom.antivpn.libs.snakeyaml'
    relocate 'revxrsal.commands', 'com.axiom.antivpn.libs.lamp'
    relocate 'net.kyori.adventure.text.minimessage', 'com.axiom.antivpn.libs.minimessage'

    minimize {
        exclude dependency('com.github.ben-manes.caffeine:.*')
        exclude dependency('io.github.revxrsal:.*')
        exclude dependency('org.xerial:sqlite-jdbc:.*')
    }
}

build.dependsOn shadowJar

processResources {
    def pluginVersion = version
    filesMatching('plugin.yml') { expand(version: pluginVersion) }
}
